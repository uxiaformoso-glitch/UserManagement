<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de usuarios</title>
</head>
<body>
    <h1>Gestor de Usuarios</h1>
    
    <button id="btn-uploadUsers">Cargar Usuarios</button>
    <h2>Lista de Usuarios</h2>
    <ul id="usersList"></ul>
    
    <h2>Añadir un Usuario</h2>
    <form id="addUserForm">
        <input type="text" placeholder="Nombre" id="inputName" required>
        <input type="email" placeholder="Email" id="inputEmail" required>
        <button type="submit" id="btn-addNewUser">Añadir</button>
    </form>
    
    <script src="main.js"></script>
</body>
</html>
